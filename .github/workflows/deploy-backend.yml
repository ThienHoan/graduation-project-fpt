name: Deploy Backend to VPS

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/deploy-backend.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: backend
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        working-directory: backend
        # Dùng binary prisma 6.19.3 đã pin trong dependencies thay vì `npx
        # prisma`: khi thiếu node_modules, `npx` tải prisma@7 mới nhất → schema
        # 6.x báo P1012 (datasource `url`/`directUrl` không còn hợp lệ).
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Build NestJS
        working-directory: backend
        run: pnpm exec nest build

      - name: Copy dist to VPS via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # Tar chứa đường dẫn "backend/dist/...". strip_components: 2 bỏ đi
          # "backend/dist" nên đích phải trỏ thẳng vào thư mục `dist` của app.
          # Trước đây target là thư mục gốc backend ⇒ file bị đổ ra
          # `backend/main.js`, còn `backend/dist/main.js` vẫn là bản build cũ,
          # nên PM2 restart xong vẫn chạy code cũ (thiếu route /chat/faq).
          source: "backend/dist"
          target: "~/graduation-project-fpt/backend/dist"
          strip_components: 2
          rm: true

      - name: Restart Backend on VPS via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/graduation-project-fpt/backend

            # Luôn đưa source trên VPS về đúng main. `git pull` bị chặn khi VPS có thay đổi
            # cục bộ (vd. backend/package.json) làm các bước sau không chạy. .env không bị ảnh hưởng.
            git fetch origin main
            git reset --hard origin/main

            # Install production dependencies only.
            # CI=true để pnpm không hỏi tương tác khi cần purge node_modules
            # (không có TTY qua SSH → mặc định pnpm abort với
            # ERR_PNPM_ABORTED_REMOVE_MODULES_DIR_NO_TTY).
            #
            # `prisma` đã được chuyển sang dependencies (pin đúng 6.19.3) nên
            # vẫn có binary sau khi cài `--prod`; nhờ vậy generate không rơi về
            # `npx prisma` → tải prisma 7 → schema 6.x báo P1012
            # (datasource `url`/`directUrl` không còn hợp lệ).
            CI=true pnpm install --prod --frozen-lockfile --config.confirmModulesPurge=false

            # Generate Prisma client bằng binary cục bộ (không qua npx).
            # `.env` chứa DATABASE_URL cần cho bước đọc schema.
            if [ -f .env ]; then set -a; . ./.env; set +a; fi
            if [ ! -x node_modules/.bin/prisma ]; then
              echo "❌ Thiếu node_modules/.bin/prisma (prisma CLI chưa được cài)."
              exit 1
            fi
            prisma_major=$(node -p "require('./node_modules/prisma/package.json').version.split('.')[0]" || echo "?")
            echo "Prisma CLI major: $prisma_major"
            if [ "$prisma_major" != "6" ]; then
              echo "❌ Prisma CLI phải là 6.x (schema dùng datasource url/directUrl); đang là $prisma_major."
              exit 1
            fi
            node_modules/.bin/prisma generate

            # Tìm pm2. `appleboy/ssh-action` chạy shell non-login nên KHÔNG nạp
            # ~/.bashrc/.profile → nvm và thư mục npm-global thường không có
            # trong PATH, dù pm2 đã được cài. Dò lần lượt các vị trí phổ biến.
            if [ -s "${NVM_DIR:-$HOME/.nvm}/nvm.sh" ]; then
              . "${NVM_DIR:-$HOME/.nvm}/nvm.sh" >/dev/null 2>&1 || true
            fi
            PM2_BIN="$(command -v pm2 2>/dev/null || true)"
            if [ -z "$PM2_BIN" ]; then
              npm_global_bin="$(npm prefix -g 2>/dev/null || true)/bin"
              for candidate in \
                "$npm_global_bin/pm2" \
                "$HOME"/.nvm/versions/node/*/bin/pm2 \
                "$HOME/.local/bin/pm2" \
                "/usr/local/bin/pm2" \
                "/usr/bin/pm2"; do
                if [ -x "$candidate" ]; then PM2_BIN="$candidate"; break; fi
              done
            fi
            if [ -z "$PM2_BIN" ]; then
              echo "❌ Không tìm thấy pm2 trên VPS. Cài bằng: npm i -g pm2 (rồi chạy lại job)."
              exit 1
            fi
            echo "Dùng pm2: $PM2_BIN"
            "$PM2_BIN" restart be-api || "$PM2_BIN" start dist/main.js --name "be-api" --node-args="--max-old-space-size=384"

            # Fail sớm nếu bundle mới không thực sự được nạp: route mới phải
            # trả 401 do guard auth; 404 nghĩa là vẫn chạy code cũ.
            sleep 3
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:4000/api/chat/faq || true)
            echo "GET /api/chat/faq -> $code"
            if [ "$code" = "404" ] || [ -z "$code" ]; then
              echo "❌ Bundle mới chưa được nạp (route /api/chat/faq = $code)."
              exit 1
            fi

            echo "✅ Deploy complete"
