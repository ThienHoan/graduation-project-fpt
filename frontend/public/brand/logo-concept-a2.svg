<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%" fill="none" role="img" aria-labelledby="a2Title">
  <title id="a2Title">Cổ Phục Hoàng Thành - Kim Ấn Triều Nguyễn</title>
  <defs>
    <linearGradient id="goldA2" x1="20" y1="20" x2="236" y2="236" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#D4AF37" />
      <stop offset="75%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <radialGradient id="rubyBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="85%" stop-color="#450A0A" />
      <stop offset="100%" stop-color="#1C1917" />
    </radialGradient>
  </defs>

  <!-- Nền ấn triện hoàng gia (Royal Seal Badge Background) -->
  <rect x="20" y="20" width="216" height="216" rx="44" fill="url(#rubyBg)" stroke="url(#goldA2)" stroke-width="6" />
  
  <!-- Viền chỉ vàng kép cung đình (Double Gold Filigree Inset) -->
  <rect x="30" y="30" width="196" height="196" rx="34" stroke="url(#goldA2)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Chữ C (Cổ Phục) cách điệu vạt áo ngũ thân lớn bao bọc -->
  <path
    d="M 184 80 C 154 54 98 56 68 94 C 42 128 46 174 80 200 C 114 224 168 220 196 182"
    stroke="url(#goldA2)"
    stroke-width="15"
    stroke-linecap="round"
  />

  <!-- Trụ đứng nẹp áo & Thân chữ P (Imperial Placket) -->
  <path
    d="M 112 64 L 112 192"
    stroke="url(#goldA2)"
    stroke-width="15"
    stroke-linecap="round"
  />

  <!-- Vành khuyên chữ P & Vạt áo cung đình -->
  <path
    d="M 112 74 C 154 68 186 86 186 118 C 186 150 152 164 112 164"
    stroke="url(#goldA2)"
    stroke-width="14"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Điểm nút 5 khuy ngũ thường (Ngũ Thân 5 Jade Buttons) -->
  <circle cx="112" cy="74" r="6" fill="#FDE68A" />
  <circle cx="112" cy="104" r="6" fill="#FDE68A" />
  <circle cx="112" cy="134" r="6" fill="#FDE68A" />
  <circle cx="112" cy="164" r="6" fill="#FDE68A" />
  <circle cx="112" cy="192" r="6" fill="#FDE68A" />

  <!-- Khuy ngọc chính nổi bật (Central Golden Lotus Gem) -->
  <circle cx="148" cy="118" r="9" fill="#D4AF37" stroke="#FEF08A" stroke-width="2" />
</svg>
